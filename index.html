    <!-- change header size on scroll -->
    <script type="text/javascript">
      $(document).on("scroll", function () {
        if ($(document).scrollTop() > 5) {
          $("#landing-slot").removeClass("large").addClass("small");
          $(".arrow-link").css("visibility", "hidden");
          $("#like-button").css("visibility", "hidden");
        } else {
          $("#landing-slot").removeClass("small").addClass("large");
          $(".arrow-link").css("visibility", "visible");
          $("#like-button").css("visibility", "visible");
        }
      });
    </script>

    <!-- hide navbar on on scroll down   -->
    <script type="text/javascript">
      var didScroll;
      var lastScrollTop = 0;
      var delta = 5;
      var navbarHeight = $("nav").outerHeight();

      $(window).scroll(function (event) {
        didScroll = true;
      });

      setInterval(function () {
        if (didScroll) {
          hasScrolled();
          didScroll = false;
        }
      }, 250);

      function hasScrolled() {
        var st = $(this).scrollTop();

        // Make sure they scroll more than delta
        if (Math.abs(lastScrollTop - st) <= delta) return;

        // If they scrolled down and are past the navbar, add class .nav-up.
        // This is necessary so you never see what is "behind" the navbar.
        if (st > lastScrollTop && st > navbarHeight) {
          // Scroll Down
          $("nav").addClass("navbar-hidden");
        } else {
          // Scroll Up
          if (st + $(window).height() < $(document).height()) {
            $("nav").removeClass("navbar-hidden");
          }
        }

        lastScrollTop = st;
      }
    </script>

    <!--stop audio when another starts-->
    <script type="text/javascript">
      document.addEventListener(
        "play",
        function (e) {
          var audios = document.getElementsByTagName("audio");
          for (var i = 0, len = audios.length; i < len; i++) {
            if (audios[i] != e.target) {
              audios[i].pause();
            }
          }
        },
        true,
      );
    </script>

    <!--smooth scroll to anchor-->
    <script type="text/javascript">
      $(document).ready(function () {
        // Add smooth scrolling to all links
        $("a").on("click", function (event) {
          if ($("#landing-slot.large")[0]) {
            var extra_height = $("#landing-slot").height() / 2;
          } else {
            var extra_height = 0;
          }

          // Make sure this.hash has a value before overriding default behavior
          if (this.hash !== "") {
            // Prevent default anchor click behavior
            event.preventDefault();

            // Store hash
            var hash = this.hash;

            // Using jQuery's animate() method to add smooth page scroll
            // The optional number (800) specifies the number of milliseconds it takes to scroll to the specified area
            $("html, body").animate(
              {
                scrollTop: $(hash).offset().top - extra_height - 60,
              },
              300,
              function () {
                // Add hash (#) to URL when done scrolling (default click behavior)
                window.location.hash = hash;
              },
            );
          } // End if
        });
      });
    </script>
